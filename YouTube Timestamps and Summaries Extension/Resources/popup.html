<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <main class="popup">
        <label class="row">
            <span>Current video chapters</span>
            <select id="video-chapter-source">
                <option id="video-chapter-source-native" value="native">Native</option>
                <option id="video-chapter-source-generated" value="generated">Generated</option>
            </select>
        </label>
        <button id="open-settings" class="row button" type="button">
            <span>Settings</span>
        </button>
        <p id="popup-error" class="error" hidden></p>
    </main>
</body>
</html>

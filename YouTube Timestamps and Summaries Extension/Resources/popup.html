<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
</head>
<body>
    <main class="popup">
        <label class="row">
            <span>Extension enabled</span>
            <input id="extension-enabled" type="checkbox" checked>
        </label>
        <button id="open-settings" class="row button" type="button">
            <span>Settings</span>
        </button>
        <p id="popup-error" class="error" hidden></p>
    </main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | escape }}{% unless page.home %} | {{ site.title | escape }}{% endunless %}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <header class="site-header">
      <a class="site-brand" href="{{ '/' | relative_url }}">Timestamps &amp; Summaries for YT</a>
      <nav class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.home %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/support.html' | relative_url }}"{% if page.url == '/support.html' %} aria-current="page"{% endif %}>Support</a>
        <a href="{{ '/privacy.html' | relative_url }}"{% if page.url == '/privacy.html' %} aria-current="page"{% endif %}>Privacy</a>
        <a href="{{ '/terms.html' | relative_url }}"{% if page.url == '/terms.html' %} aria-current="page"{% endif %}>Terms</a>
      </nav>
    </header>
    <main{% unless page.home %} class="site-content"{% endunless %}>
      {{ content }}
    </main>
    <footer class="site-footer">
      <a href="mailto:hlbkomer@gmail.com">Contact</a>
      <a href="https://github.com/Hlbkomer/YouTube-Timestamps-and-Summaries/issues">Report an issue</a>
      <a href="https://github.com/Hlbkomer/YouTube-Timestamps-and-Summaries">Source code</a>
    </footer>
  </div>
</body>
</html>
